name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,bench,dashboard]"
      - name: Lint
        run: ruff check .
      - name: Tests (no Windows Calculator or Ollama needed)
        run: pytest --cov=mcpcalc --cov-report=term-missing --cov-fail-under=80
      - name: Benchmark harness sanity check (oracle LLM must score 100%)
        run: mcpcalc-bench --llm oracle --limit 60 --out bench-out
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: bench-sanity
          path: bench-out
